<title>Konehomma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap">
<style>
:root{
  /* Full-bleed pixel game: canvas fills the stage, chunky toy buttons float in the bottom corners */
  --grass:#6c8f3e; --ink:#2a2420; --paper:#fff4d6;
  --yellow:#f4b81c; --yellow-hi:#ffd866; --yellow-lo:#c48c08;
  --red:#e2552b; --red-hi:#ff8a5c; --red-lo:#a8381a;
  --font:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  --s:clamp(58px,17vw,84px);
  --c-loader:#f4b81c; --c-truck:#3e80d6; --c-exc:#f07a1a;
  --m:clamp(48px,13vw,60px);
}
html{height:100%;box-sizing:border-box}
body{height:100%;background:var(--grass);color:var(--paper);font-family:var(--font);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.stage{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.pad{position:absolute;bottom:16px;display:none;gap:12px;align-items:flex-end}
body.touch .pad{display:flex}
body.touch .pad.sw{display:none;bottom:calc(16px + var(--s) + 26px)}
body.touch.exc .pad.sw{display:flex}
.btn.sw{background:var(--orange,#e8731c);box-shadow:inset -5px -5px 0 rgba(0,0,0,.25),inset 5px 5px 0 rgba(255,255,255,.3),0 5px 0 var(--ink)}
.btn.sw.on{box-shadow:inset 5px 5px 0 rgba(0,0,0,.25),0 1px 0 var(--ink)}
.btn.sw svg{width:66%;height:66%}
.pad.l{left:max(16px,env(safe-area-inset-left,0px))}
.pad.r{right:max(16px,env(safe-area-inset-right,0px))}
.col{display:flex;flex-direction:column;gap:12px}
.btn{appearance:none;-webkit-appearance:none;width:var(--s);height:var(--s);padding:0;margin:0;border:4px solid var(--ink);border-radius:6px;
  background:var(--yellow);box-shadow:inset -5px -5px 0 var(--yellow-lo),inset 5px 5px 0 var(--yellow-hi),0 5px 0 var(--ink);
  display:grid;place-items:center;touch-action:none;cursor:pointer}
.btn.on{transform:translateY(4px);box-shadow:inset 5px 5px 0 var(--yellow-lo),0 1px 0 var(--ink)}
.btn svg{width:56%;height:56%;fill:var(--ink);shape-rendering:crispEdges;pointer-events:none}
.btn.act{width:calc(var(--s) * 1.35);height:calc(var(--s) * 1.35);border-radius:50%;background:var(--red);
  box-shadow:inset -6px -6px 0 var(--red-lo),inset 6px 6px 0 var(--red-hi),0 5px 0 var(--ink)}
.btn.act.on{box-shadow:inset 6px 6px 0 var(--red-lo),0 1px 0 var(--ink)}
.btn.act svg{fill:var(--paper);width:60%;height:60%}
.btn:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(42,36,32,.85);color:var(--paper);
  padding:8px 14px;border-radius:4px;font-size:15px;letter-spacing:.02em;white-space:nowrap;max-width:calc(100% - 32px);
  overflow:hidden;text-overflow:ellipsis;transition:opacity .8s;pointer-events:none}
.hint b{color:var(--yellow);font-weight:700}
.hint b.num{font-family:ui-monospace,"Courier New",monospace}
.hint.gone{opacity:0}
body.touch .hint{display:none}
.reset{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));width:40px;height:40px;padding:0;
  border:3px solid var(--ink);border-radius:6px;background:rgba(255,244,214,.75);display:grid;place-items:center;cursor:pointer}
.reset svg{width:60%;height:60%;fill:var(--ink)}
.reset:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
.mpick{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));display:flex;gap:10px}
.mb{appearance:none;-webkit-appearance:none;position:relative;width:var(--m);height:var(--m);padding:0;margin:0;cursor:pointer;
  border:4px solid var(--ink);border-radius:6px;background:var(--mc);box-shadow:inset -4px -4px 0 rgba(0,0,0,.22),inset 4px 4px 0 rgba(255,255,255,.3),0 4px 0 var(--ink);
  display:grid;place-items:center;touch-action:none;opacity:.8}
.mb svg{width:70%;height:70%;fill:var(--ink);shape-rendering:crispEdges;pointer-events:none;margin-top:14%}
.mb span{position:absolute;left:3px;top:1px;font:700 16px/1 ui-monospace,"Courier New",monospace;color:var(--ink);pointer-events:none}
.mb.sel{opacity:1;outline:3px solid var(--paper);outline-offset:2px;transform:translateY(-2px)}
.mb.on{transform:translateY(3px);box-shadow:inset 4px 4px 0 rgba(0,0,0,.22),0 1px 0 var(--ink)}
.start{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:clamp(14px,3vh,28px);
  background:rgba(42,36,32,.5);z-index:5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.start[hidden]{display:none}
.start h1{margin:0;font:700 clamp(34px,9vw,64px)/1 var(--font);color:var(--yellow);letter-spacing:.04em;text-align:center;
  text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
.startbtn{appearance:none;-webkit-appearance:none;width:min(62vw,52vh,280px);aspect-ratio:1;max-width:100%;border-radius:50%;cursor:pointer;
  border:6px solid var(--ink);background:var(--red);color:var(--paper);display:grid;place-items:center;align-content:center;gap:4%;padding:0;
  box-shadow:inset -10px -10px 0 var(--red-lo),inset 10px 10px 0 var(--red-hi),0 10px 0 var(--ink);
  font:700 clamp(34px,10vw,60px)/1 var(--font);letter-spacing:.06em;animation:pulse 1.4s ease-in-out infinite;touch-action:manipulation}
.startbtn svg{width:34%;height:auto;fill:var(--paper);shape-rendering:crispEdges}
.startbtn:active{transform:translateY(6px);box-shadow:inset 10px 10px 0 var(--red-lo),0 3px 0 var(--ink)}
.startbtn:focus-visible{outline:4px solid var(--paper);outline-offset:6px}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.06}}
@media (prefers-reduced-motion: reduce){.hint{transition:none}.startbtn{animation:none}}
</style>

<div class="stage" id="stage">
  <canvas id="cv"></canvas>

  <div class="mpick" id="mpick">
    <button class="mb" tabindex="-1" data-m="0" style="--mc:var(--c-loader)" aria-label="1 Pyöräkuormaaja"><span>1</span><svg viewBox="0 0 12 12"><path d="M3 2H6V5H8L10 7H11V10H9V8H8V7H1V5H3Z"/><circle cx="3" cy="9" r="1.6"/><circle cx="7" cy="9" r="1.6"/></svg></button>
    <button class="mb" tabindex="-1" data-m="1" style="--mc:var(--c-truck)" aria-label="2 Kuorma-auto"><span>2</span><svg viewBox="0 0 12 12"><path d="M1 4H7V8H1Z M8 3H11V8H8Z"/><circle cx="3" cy="9" r="1.5"/><circle cx="9.3" cy="9" r="1.5"/></svg></button>
    <button class="mb" tabindex="-1" data-m="2" style="--mc:var(--c-exc)" aria-label="3 Kaivuri"><span>3</span><svg viewBox="0 0 12 12"><path d="M1 5H6V3H8V7H1Z M7 4L9 1L11 2L11 6L9 6L10 3L8 5Z"/><circle cx="2.5" cy="9" r="1.5"/><circle cx="6" cy="9" r="1.5"/></svg></button>
  </div>

  <div class="pad l sw">
    <button class="btn sw" tabindex="-1" data-k="swl" aria-label="Käännä tornia vasemmalle"><svg viewBox="0 0 12 12"><path d="M6 2A4 4 0 1 1 2.2 7.2H4A2.3 2.3 0 1 0 6 3.7V5.2L2.5 3.2L6 0.7Z"/></svg></button>
    <button class="btn sw" tabindex="-1" data-k="swr" aria-label="Käännä tornia oikealle"><svg viewBox="0 0 12 12" style="transform:scaleX(-1)"><path d="M6 2A4 4 0 1 1 2.2 7.2H4A2.3 2.3 0 1 0 6 3.7V5.2L2.5 3.2L6 0.7Z"/></svg></button>
  </div>
  <div class="pad l">
    <button class="btn" tabindex="-1" data-k="left" aria-label="Käännä vasemmalle"><svg viewBox="0 0 8 8" style="transform:rotate(-90deg)"><path d="M4 1L7 4H5V7H3V4H1Z"/></svg></button>
    <button class="btn" tabindex="-1" data-k="right" aria-label="Käännä oikealle"><svg viewBox="0 0 8 8" style="transform:rotate(90deg)"><path d="M4 1L7 4H5V7H3V4H1Z"/></svg></button>
  </div>
  <div class="pad r">
    <button class="btn act" tabindex="-1" id="act" aria-label="Kauha tai lava"><svg viewBox="0 0 12 12"><path id="acticon" d="M1 2H3V8H9L10 6H11V9L10 10H2L1 9Z"/></svg></button>
    <div class="col">
      <button class="btn" tabindex="-1" data-k="up" aria-label="Eteenpäin"><svg viewBox="0 0 8 8"><path d="M4 1L7 4H5V7H3V4H1Z"/></svg></button>
      <button class="btn" tabindex="-1" data-k="down" aria-label="Peruuta"><svg viewBox="0 0 8 8" style="transform:rotate(180deg)"><path d="M4 1L7 4H5V7H3V4H1Z"/></svg></button>
    </div>
  </div>

  <div class="start" id="start">
    <h1>AARON<br>KONEHOMMA</h1>
    <button class="startbtn" id="startbtn" aria-label="Aloita peli"><svg viewBox="0 0 10 10"><path d="M2 1H4V2H5V3H6V4H7V6H6V7H5V8H4V9H2Z"/></svg>START</button>
  </div>
  <div class="hint" id="hint"><b>← →</b> kääntää · <b>↑</b> eteen · <b>↓</b> peruutus · <b>välilyönti</b> kauha / lava · <b>Del PgDn</b> kaivurin torni · <b class="num">1 2 3</b> vaihtaa konetta</div>
  <button class="reset" id="reset" aria-label="Aloita alusta"><svg viewBox="0 0 10 10"><path d="M5 1A4 4 0 1 0 9 5H7.4A2.4 2.4 0 1 1 5 2.6V4.2L7.6 1.8L5 -0.6Z"/></svg></button>
</div>

<script>
(() => {
/* ---------- world constants ---------- */
const TW = 40, TH = 20, ZH = 22;          // isometric tile size and height scale (pixels per world unit)
const M = 60, G0 = 6, G1 = 54;            // world size, gravel field bounds
const HW = 1.45;                          // road half width, in on-screen units of 20 px
const sd = (dx, dy) => Math.hypot((dy - dx) * 20, (dx + dy) * 10) / 20;   // on-screen distance of a ground offset
const BR = 0.12, D2 = (2 * BR) * (2 * BR); // dirt ball radius
const GW = M * TW, GH = M * TH;
const PILE = { x: 30, y: 30 };
const H0 = Math.atan2(3.7, 1.4);
const START_L = { x: 17, y: 36.8, h: -2.17 };
const START_T = { x: 37.5, y: 27.5, h: -Math.PI / 4 };
const START_E = { x: 26, y: 31.3, h: -0.31 };

const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let IW = 0, IH = 0, SC = 2;

const isTouch = matchMedia('(pointer: coarse)').matches || (navigator.maxTouchPoints || 0) > 0;
if (isTouch) document.body.classList.add('touch');

function resize() {
  const W = stage.clientWidth, H = stage.clientHeight, dpr = window.devicePixelRatio || 1;
  SC = Math.max(dpr >= 2 ? 0.8 : 1.1, Math.min(W, H) / 440);
  if (dpr >= 2) SC = Math.max(1, Math.round(SC * dpr)) / dpr;   // whole device pixels per game pixel
  IW = Math.ceil(W / SC); IH = Math.ceil(H / SC);
  cv.width = IW; cv.height = IH;
  cv.style.width = IW * SC + 'px'; cv.style.height = IH * SC + 'px';
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize); resize();

/* ---------- helpers ---------- */
function hh(x, y) {

  n = Math.imul(n ^ (n >>> 13), 1274126177); n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const approach = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);
const gp = (x, y) => [GW / 2 + (y - x) * TW / 2, (x + y) * TH / 2];   // world -> ground canvas pixel

/* ---------- road: a wiggly closed loop ---------- */
const NS = 1440, RX = new Float32Array(NS), RY = new Float32Array(NS), RS = new Float32Array(NS);
{ let acc = 0;
  for (let i = 0; i < NS; i++) {
    const t = i / NS * Math.PI * 2, r = 16 + 2.4 * Math.sin(3 * t) + 1.4 * Math.cos(2 * t + 0.7);
    RX[i] = 30 + r * Math.cos(t); RY[i] = 30 + r * Math.sin(t);
    if (i) acc += sd(RX[i] - RX[i - 1], RY[i] - RY[i - 1]);
    RS[i] = acc;
  } }
const GR = 8, GN = M * GR + 1, DF = new Float32Array(GN * GN).fill(9), DI = new Int32Array(GN * GN);
for (let i = 0; i < NS; i++) {
  const x0 = Math.max(0, Math.floor((RX[i] - 3) * GR)), x1 = Math.min(GN - 1, Math.ceil((RX[i] + 3) * GR));
  const y0 = Math.max(0, Math.floor((RY[i] - 3) * GR)), y1 = Math.min(GN - 1, Math.ceil((RY[i] + 3) * GR));
  for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) {
    const d = sd(gx / GR - RX[i], gy / GR - RY[i]), k = gy * GN + gx;
    if (d < DF[k]) { DF[k] = d; DI[k] = i; }
  }
}
let RD = 9, RSV = 0;
function roadAt(x, y) {
  const fx = x * GR, fy = y * GR, ix = Math.floor(fx), iy = Math.floor(fy);
  if (ix < 0 || iy < 0 || ix >= GN - 1 || iy >= GN - 1) { RD = 9; return; }
  const ax = fx - ix, ay = fy - iy, k = iy * GN + ix;
  RD = (DF[k] * (1 - ax) + DF[k + 1] * ax) * (1 - ay) + (DF[k + GN] * (1 - ax) + DF[k + GN + 1] * ax) * ay;
  RSV = RS[DI[Math.round(fy) * GN + Math.round(fx)]];
}
const gEdge = (x, y) => Math.min(x - G0, G1 - x, y - G0, G1 - y) + 0.35 * Math.sin(x * 1.3 + y * 0.7) + 0.25 * Math.sin(x * 0.5 - y * 2.1);

/* ---------- bake the ground once ---------- */
const ground = document.createElement('canvas'); ground.width = GW; ground.height = GH;
{
  const g = ground.getContext('2d'), img = g.createImageData(GW, GH), D = img.data;
  const C = {
    g1: [184, 167, 135], g2: [176, 159, 127], g3: [192, 176, 144], gD: [140, 124, 98], gL: [216, 202, 172], gM: [160, 144, 114], gS: [150, 135, 108],
    a: [78, 80, 87], aD: [67, 69, 75], aL: [98, 100, 108], aE: [58, 60, 66], line: [232, 230, 218], yel: [242, 196, 62],
    gr: [108, 143, 62], grD: [90, 122, 51], grL: [128, 165, 74], edge: [146, 128, 96]
  };
  let o = 0;
  for (let py = 0; py < GH; py++) for (let px = 0; px < GW; px++, o += 4) {
    const a = (px - GW / 2) / (TW / 2), b = py / (TH / 2), x = (b - a) / 2, y = (a + b) / 2;
    const n = hh(px, py); let col;
    const e = gEdge(x, y);
    if (e < 0) {
      col = n < 0.12 ? C.grD : n > 0.9 ? C.grL : C.gr;
      if (e > -0.2) col = n < 0.55 ? C.edge : C.grD;
    } else {
      roadAt(x, y);
      if (RD < HW) {
        if (RD > HW - 0.1) col = C.aE;
        else if (RD > HW - 0.34 && RD < HW - 0.22) col = C.line;
        else if (RD < 0.09 && (RSV % 1.5) < 0.8) col = C.yel;
        else col = n < 0.1 ? C.aD : n > 0.93 ? C.aL : C.a;
      } else {
        const pch = hh(Math.floor(x * 1.5) + 999, Math.floor(y * 1.5));
        col = pch < 0.33 ? C.g1 : pch < 0.66 ? C.g2 : C.g3;
        if (n < 0.07) col = C.gD; else if (n > 0.94) col = C.gL; else if (n > 0.45 && n < 0.5) col = C.gM;
        if (RD < HW + 0.14) col = n < 0.5 ? C.gS : C.gD;
      }
    }
    D[o] = col[0]; D[o + 1] = col[1]; D[o + 2] = col[2]; D[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const R = rng(7);
  for (let i = 0; i < 180; i++) {               // stones on the gravel
    const x = G0 + 1 + R() * (G1 - G0 - 2), y = G0 + 1 + R() * (G1 - G0 - 2);
    roadAt(x, y);
    if (RD < HW + 0.5 || Math.hypot(x - PILE.x, y - PILE.y) < 3) continue;
    const [sx, sy] = gp(x, y).map(Math.round), big = R() < 0.3;
    g.fillStyle = '#76706a'; g.fillRect(sx, sy, big ? 4 : 3, big ? 3 : 2);
    g.fillStyle = '#a49e94'; g.fillRect(sx, sy, big ? 3 : 2, 1);
  }
  for (let i = 0; i < 650; i++) {               // grass tufts
    const x = R() * M, y = R() * M;
    if (gEdge(x, y) > -0.5) continue;
    const [sx, sy] = gp(x, y).map(Math.round);
    g.fillStyle = '#56772f'; g.fillRect(sx, sy, 1, 2); g.fillRect(sx + 2, sy, 1, 2); g.fillRect(sx + 1, sy + 1, 1, 1);
    g.fillStyle = '#8fb553'; g.fillRect(sx + 1, sy - 1, 1, 1);
  }
}
/* ---------- holes to fill with gravel ---------- */
const HOLES = [];
function holeDepth(H, x, y) {
  const d = Math.hypot(x - H.x, y - H.y);
  return d < H.r ? -H.d * Math.min(1, (1 - d / H.r) * 3.2) : 0;
}
function makeHole(x, y, r, d, cap, road) {
  const H = { x, y, r, d, cap, road, done: false, t: -99, h: 0, rect: [-r * 0.45, r * 0.45, r * 0.45] };
  const [cx, cy] = gp(x, y);
  H.bx = Math.floor(cx - r * 29 - 2); H.by = Math.floor(cy - r * 15 - 2);
  const w = Math.ceil(r * 58 + 4), h = Math.ceil(r * 30 + 4);
  const open = document.createElement('canvas'), patch = document.createElement('canvas');
  open.width = patch.width = w; open.height = patch.height = h;
  const io = open.getContext('2d').createImageData(w, h), ip = patch.getContext('2d').createImageData(w, h);
  const top = road ? [70, 70, 76] : [150, 122, 90], wall = road ? [132, 100, 68] : [140, 106, 72], deep = [74, 52, 34];
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
    const gx = H.bx + px + 0.5, gy = H.by + py + 0.5, a = (gx - GW / 2) / (TW / 2), b = gy / (TH / 2);
    const wx = (b - a) / 2, wy = (a + b) / 2, dist = Math.hypot(wx - x, wy - y);
    if (dist >= r) continue;
    // follow the view ray into the hole until it meets the bowl surface
    let z = 0;
    for (let k = 0; k <= 160; k++) {
      const dl = k * 0.012, rz = -dl * 10 / ZH, sz = holeDepth(H, wx - dl / 2, wy - dl / 2);
      if (sz >= rz) { z = sz; break; }
    }
    const f = -z / d, n = 0.9 + 0.2 * hh(px + 77, py + 13), o = (py * w + px) * 4;
    const c0 = f < 0.22 ? top : wall, c = f < 0.22 ? c0 : [0, 1, 2].map(i => wall[i] + (deep[i] - wall[i]) * Math.min(1, (f - 0.22) / 0.78));
    io.data[o] = c[0] * n; io.data[o + 1] = c[1] * n; io.data[o + 2] = c[2] * n; io.data[o + 3] = 255;
    const ring = dist > r * 0.86, pc = road ? (ring ? [104, 106, 112] : [60, 61, 67]) : (ring ? [138, 120, 92] : [158, 138, 106]);
    ip.data[o] = pc[0] * n; ip.data[o + 1] = pc[1] * n; ip.data[o + 2] = pc[2] * n; ip.data[o + 3] = 255;
  }
  open.getContext('2d').putImageData(io, 0, 0); patch.getContext('2d').putImageData(ip, 0, 0);
  H.spr = open; H.patch = patch;
  H.rim = []; for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2; H.rim.push([x + Math.cos(a) * r, y + Math.sin(a) * r, 0]); }
  HOLES.push(H);
  return H;
}
function gz(x, y) {
  for (const H of HOLES) if (!H.done) { const z = holeDepth(H, x, y); if (z < 0) return z; }
  return 0;
}
function holeAt(x, y) {
  for (const H of HOLES) if (!H.done && Math.hypot(x - H.x, y - H.y) < H.r) return H;
  return null;
}
function roadPt(t) {
  const i = ((Math.round(t / (2 * Math.PI) * NS)) % NS + NS) % NS, j = (i + 4) % NS;
  const tx = RX[j] - RX[i], ty = RY[j] - RY[i], l = Math.hypot(tx, ty), nx = -ty / l, ny = tx / l;
  const k = 1 / sd(nx, ny);                                 // world length of one on-screen road unit across the road
  return (o) => [RX[i] + nx * o * k, RY[i] + ny * o * k];
}
const PIT = makeHole(33, 36.5, 1.6, 0.75, 85, false);

function buildExc(parts) {

function drawShadow(m, u0, u1, vm) {
  const c = Math.cos(m.h), s = Math.sin(m.h);
  const sh = [[u0, -vm], [u1, -vm], [u1, vm], [u0, vm]].map(([u, v]) => P([m.x + u * c - v * s + 0.08, m.y + u * s + v * c - 0.12, 0]));
  ctx.beginPath(); ctx.moveTo(sh[0][0], sh[0][1]);
  for (let i = 1; i < 4; i++) ctx.lineTo(sh[i][0], sh[i][1]);
  ctx.closePath(); ctx.fill();
}

function drawPointer(m) {
  const bob = Math.round(Math.sin(time * 5) * 2);
  const q = P([m.x, m.y, m.top + 0.55]);
  const x = q[0], y = q[1] + bob;
  ctx.fillStyle = '#2a2420';
  for (let r = 0; r < 6; r++) ctx.fillRect(x - 6 + r, y + r - 1, 13 - 2 * r, 1);
  ctx.fillRect(x - 3, y - 6, 7, 6);
  ctx.fillStyle = '#ffd866';
  for (let r = 0; r < 4; r++) ctx.fillRect(x - 4 + r, y + r, 9 - 2 * r, 1);
  ctx.fillRect(x - 2, y - 5, 5, 5);
}

function render() {
  ctx.fillStyle = '#6c8f3e'; ctx.fillRect(0, 0, IW, IH);
  OX = Math.round(IW / 2 - camX); OY = Math.round(IH / 2 - camY);
  ctx.drawImage(ground, OX, OY);
  for (const H of HOLES) ctx.drawImage(H.done ? H.patch : H.spr, OX + H.bx, OY + H.by);
  ctx.drawImage(tracks, OX, OY);

  ctx.fillStyle = 'rgba(40,30,20,0.28)';
  drawShadow(loader, -1.7, 0.05, 0.95);
  drawShadow({ x: loader.x, y: loader.y, h: loader.h + loader.steer }, -0.05, Math.max(1.35, 0.35 + 1.6 * Math.cos(loader.alpha) + 0.6), 0.95);
  drawShadow(CR, -2.85, 1.6, 1.05);
  ctx.fillStyle = 'rgba(40,30,20,0.18)';
  drawShadow(CR, 1.6, 4.7, 0.5);
  ctx.fillStyle = 'rgba(40,30,20,0.28)';
  drawShadow(truck, -2.15, 2.25, 1.0);
  drawShadow(exc, -1.65, 1.3, 1.0);
  if (active === exc) {                                   // dashed guide on the ground: where the bucket points
    const a = exc.h + exc.swing, c = Math.cos(a), s = Math.sin(a), q0 = P([exc.x + c * 3.3, exc.y + s * 3.3, 0]), q1 = P([exc.x + c * 7.5, exc.y + s * 7.5, 0]);
    ctx.save(); ctx.strokeStyle = 'rgba(255,250,225,0.9)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(q0[0], q0[1]); ctx.lineTo(q1[0], q1[1]); ctx.stroke(); ctx.restore();
  }
  ctx.fillStyle = 'rgba(40,30,20,0.3)';
  for (const b of balls) if (b.st === 'fall' && b.z > 0.4) { const q = P([b.x, b.y, 0]); ctx.fillRect(q[0] - 2, q[1] - 1, 5, 2); }
  for (const r of rocks) if (r.st === 'rest' || r.st === 'fall') {
    const q = P([r.x, r.y, 0]), k = r.st === 'rest' ? 1 : 0.7;
    ctx.beginPath(); ctx.ellipse(q[0] + 1, q[1] + 2, 10 * k, 4.5 * k, 0, 0, 6.283); ctx.fill();
  }

  const parts = [];
  beacons = []; lamps = [];
  buildLoader(parts);
  buildTruck(parts);
  buildExc(parts);
  PJ[1] = CR.shake > 0 ? Math.round(Math.sin(time * 70) * Math.min(1, CR.shake) * 1.4) : 0;
  buildCrusher(parts);
  PJ[1] = 0;
  // headlight pools on the ground, under everything standing
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,236,170,0.07)';
  for (const l of lamps) {
    ctx.fillStyle = l.col || 'rgba(255,236,170,0.07)';
    const a = P(l.g0), b = P(l.g1), c2 = P(l.g2);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c2[0], c2[1]); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  for (const b of balls) parts.push({ k: depth([b.x, b.y, b.z]) + 0.05, ball: b });
  for (const r of rocks) parts.push({ k: depth([r.x, r.y, r.z]) + (r.st === 'lbkt' || r.st === 'ebkt' ? 0.45 : 0.05), rock: r });
  for (const d of DECO) parts.push({ k: depth([d.p[0], d.p[1], 0.2]), deco: d });
  parts.sort((a, b) => a.k - b.k);
  ctx.lineWidth = 1; ctx.lineJoin = 'round';
  for (const p of parts) {
    if (p.rock) { const q = P([p.rock.x, p.rock.y, p.rock.z]); ctx.drawImage(ROCKSPR[p.rock.s], q[0] - 12, q[1] - 13); continue; }
    if (p.deco) { const q = P([p.deco.p[0], p.deco.p[1], 0]); ctx.drawImage(p.deco.spr, q[0] - p.deco.ax, q[1] - p.deco.ay); continue; }
    if (p.ball) {
      const b = p.ball, q = P([b.x, b.y, b.z]);
      if (q[0] > -10 && q[1] > -10 && q[0] < IW + 10 && q[1] < IH + 10) {
        const H = b.z < BR - 0.01 ? holeAt(b.x, b.y) : null;
        if (H) {                                    // the near rim hides gravel deep in a hole
          ctx.save(); ctx.beginPath();
          H.rim.forEach((r, i) => { const s2 = P(r); i ? ctx.lineTo(s2[0], s2[1]) : ctx.moveTo(s2[0], s2[1]); });
          ctx.closePath(); ctx.clip(); ctx.drawImage(BALLSPR[b.v], q[0] - 3, q[1] - 3); ctx.restore();
        } else ctx.drawImage(BALLSPR[b.v], q[0] - 3, q[1] - 3);
      }
      continue;
    }
    for (const pl of p.polys) {
      const q = pl.pts; ctx.fillStyle = ctx.strokeStyle = pl.col;
      ctx.beginPath(); ctx.moveTo(q[0][0], q[0][1]);
      for (let i = 1; i < q.length; i++) ctx.lineTo(q[i][0], q[i][1]);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  const SPC = ['#fff6b0', '#ffd866', '#ff9a3c', '#ffffff', '#d9d2c2', '#a89f8e'];
  for (const k of sparks) { const q = P([k.x, k.y, k.z]), d = k.c >= 4; ctx.globalAlpha = d ? Math.min(1, k.life * 1.4) : 1; ctx.fillStyle = SPC[k.c]; ctx.fillRect(q[0] - 1, q[1] - 1, d ? 3 : 2, d ? 3 : 2); }
  ctx.globalAlpha = 1;
  // beacon light: flashing halo, then a rotating beam
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const glow = (q, r, a) => { ctx.fillStyle = `rgba(255,160,40,${a})`; ctx.beginPath(); ctx.arc(q[0], q[1], r, 0, 6.283); ctx.fill(); };
  for (const bc of beacons) {
    const q = P(bc.p);
    if (bc.mode === 'steady') { glow(q, 4, 0.3); continue; }
    if (bc.mode === 'flash') { if (bc.on) { glow(q, 9, 0.25); glow(q, 5, 0.45); } continue; }
    const a = bc.ang, Lr = 1.9, sp = 0.24, e1 = P([bc.p[0] + Math.cos(a - sp) * Lr, bc.p[1] + Math.sin(a - sp) * Lr, bc.p[2]]),
      e2 = P([bc.p[0] + Math.cos(a + sp) * Lr, bc.p[1] + Math.sin(a + sp) * Lr, bc.p[2]]);
    ctx.fillStyle = 'rgba(255,150,30,0.2)';
    ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(e1[0], e1[1]); ctx.lineTo(e2[0], e2[1]); ctx.closePath(); ctx.fill();
    glow(P([bc.p[0] + Math.cos(a) * 0.08, bc.p[1] + Math.sin(a) * 0.08, bc.p[2]]), 3, 0.6);
  }
  for (const l of lamps) {
    const q = P(l.p);
    ctx.fillStyle = l.dot || 'rgba(255,240,190,0.35)'; ctx.beginPath(); ctx.arc(q[0], q[1], l.r || 3, 0, 6.283); ctx.fill();
  }
  ctx.restore();
  for (const k of smoke) {
    const q = P([k.x, k.y, k.z]), f = k.age / k.life, sz = Math.round(k.sz + f * 9);
    ctx.globalAlpha = k.a * (1 - f) * Math.min(1, k.age * 6); ctx.fillStyle = f < 0.5 ? '#16161a' : '#34343a';
    ctx.fillRect(q[0] - (sz >> 1), q[1] - (sz >> 1), sz, sz);
  }
  ctx.globalAlpha = 1;
  drawPointer(active);
}

/* ---------- input ---------- */
const hint = document.getElementById('hint');
let hinted = false;
function firstInput() { audio(); if (!hinted && isTouch) { hinted = true; setTimeout(() => hint.classList.add('gone'), 4000); } }
/* start screen: the first tap unlocks sound, so the engine is heard as soon as a machine can be driven */
let started = false;
const startEl = document.getElementById('start'), startBtn = document.getElementById('startbtn');
function crank() {
  if (!AC) return; const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(18, t); o.frequency.linearRampToValueAtTime(34, t + 0.5); o.frequency.exponentialRampToValueAtTime(60, t + 0.9);
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 320;
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.16, t + 0.08);
  g.gain.setValueAtTime(0.16, t + 0.75); g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
  o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + 1.25);
}
function startGame() {
  if (started) return;
  started = true; startEl.hidden = true;
  firstInput(); crank();
}
startBtn.addEventListener('click', startGame);
startBtn.focus();
const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', Delete: 'swl', PageDown: 'swr' };
addEventListener('keydown', e => {
  if (!started) { if ([' ', 'Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key) || e.code === 'Space') { e.preventDefault(); startGame(); } return; }
  if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = 1; e.preventDefault(); firstInput(); }
  else if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); firstInput(); if (!e.repeat) action(); }
  else if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault(); firstInput(); if (!e.repeat) nextMachine(); }
  else if (e.key === '1' || e.key === '2' || e.key === '3') { firstInput(); setActive(machines[+e.key - 1]); }
});
addEventListener('keyup', e => { if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = 0; e.preventDefault(); } });
addEventListener('blur', () => { for (const k in keys) keys[k] = 0; });

// tap or click a machine to drive it
cv.addEventListener('pointerdown', e => {
  firstInput();
  const r = cv.getBoundingClientRect(), ix = (e.clientX - r.left) / r.width * IW, iy = (e.clientY - r.top) / r.height * IH;
  let best = null, bd = 60;
  for (const m of machines) {
    const q = P([m.x, m.y, 1.0]), d = Math.hypot(q[0] - ix, q[1] - iy);
    if (d < bd) { bd = d; best = m; }
  }
  if (best) setActive(best);
});

for (const el of document.querySelectorAll('.btn[data-k]')) {
  const k = el.dataset.k;
  const on = e => { e.preventDefault(); firstInput(); keys[k] = 1; el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = () => { keys[k] = 0; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off);
}
mbtns.forEach((b, i) => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); firstInput(); setActive(machines[i]); b.classList.add('on'); });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, () => b.classList.remove('on'));
});
const act = document.getElementById('act');
act.addEventListener('pointerdown', e => { e.preventDefault(); firstInput(); action(); act.classList.add('on'); });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) act.addEventListener(ev, () => act.classList.remove('on'));
document.getElementById('reset').addEventListener('click', e => { e.currentTarget.blur(); reset(); });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- loop ---------- */
reset();
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, Math.max(0, (t - last) / 1000)); last = t;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
